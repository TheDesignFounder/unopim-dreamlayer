name: Released UnoPim compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  released-hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: v0.1.0, php: '8.3'}
          - {tag: v1.0.1, php: '8.3'}
          - {tag: v2.1.6, php: '8.4'}
          - {tag: v3.1.3, php: '8.4'}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_DATABASE: unopim_extension_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pdisposable-ci-password" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8000
      APP_ADMIN_URL: admin
      APP_LOCALE: en_US
      APP_CURRENCY: USD
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: unopim_extension_test
      DB_USERNAME: root
      DB_PASSWORD: disposable-ci-password
      CACHE_STORE: array
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: database
      DREAMLAYER_QUEUE_CONNECTION: database
      MAIL_MAILER: array
      ELASTICSEARCH_ENABLED: 'false'
      INSTALLER_ADMIN_EMAIL: ci@example.test
      INSTALLER_ADMIN_PASSWORD: disposable-ci-password
    steps:
      - uses: actions/checkout@v4
        with: {path: extension}
      - uses: actions/checkout@v4
        with:
          repository: unopim/unopim
          ref: ${{ matrix.tag }}
          path: host
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: calendar, curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, zip
          tools: composer:v2
          coverage: none
      - name: Install locked host and extension without dependency changes
        working-directory: host
        env:
          COMPOSER_ROOT_VERSION: ${{ matrix.tag }}
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          cp composer.lock /tmp/host-lock.json
          php artisan key:generate --no-interaction
          composer config repositories.dreamlayer '{"type":"path","url":"../extension","options":{"symlink":true}}'
          composer require dreamlayer/unopim-dreamlayer:0.3.0 --prefer-dist --no-interaction --no-progress
          python3 ../extension/tools/check-host-lock.py /tmp/host-lock.json composer.lock
          php artisan unopim:install --skip-env-check --skip-admin-creation --no-interaction
          php artisan migrate --force --no-interaction
      - name: Released host image workflow
        working-directory: host
        run: |
          php ../extension/tests/compatibility.php
          php ../extension/tests/view-compatibility.php
      - name: Extension regressions on current released host
        if: matrix.tag == 'v3.1.3'
        working-directory: host
        run: UNOPIM_HOST_ROOT="$PWD" vendor/bin/phpunit -c ../extension/tests/phpunit.xml --fail-on-warning --fail-on-risky
      - name: Distribution
        working-directory: extension
        run: |
          php tools/check-translations.php
          php tests/safe-bootstrap.php
          composer validate --no-check-publish
          python3 tools/build_release.py
